<script>
    let datetxt = "29 Sep";
    let datatxtletter = "My love. You are a very special girl. I always silently thank you for coming into my life. Today, I wish you all the best, lots of health, and lots of joy. I always hope we will celebrate many more birthdays like this together. Happy birthday to you.💕";
    let titleLetter = "To you";
    let charArrDate = datetxt.split('');
    let charArrDateLetter = datatxtletter.split('');
    let charArrTitle = titleLetter.split('');
    let currentIndex = 0;
    let currentIndexLetter = 0;
    let currentIndexTitle = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");
    let text__letter = document.querySelector(".text__letter p");
    setTimeout(function () {
        timeDatetxt = setInterval(function () {
            if (currentIndex < charArrDate.length) {
                date__of__birth.textContent += charArrDate[currentIndex];
                currentIndex++;
            }
            else {
                let i = document.createElement("i");
                i.className = "fa-solid fa-star"
                document.querySelector(".date__of__birth").prepend(i)
                document.querySelector(".date__of__birth").appendChild(i.cloneNode(true))
                clearInterval(timeDatetxt)
            }
        }, 100)
    }, 12000)

    var intervalContent;
    var intervalTitle;
    $("#btn__letter").on("click", function () {
        $(".box__letter").slideDown()
        setTimeout(function () {
            $(".letter__border").slideDown();
        }, 1000)
        setTimeout(function () {
            intervalTitle = setInterval(function () {
                if (currentIndexTitle < charArrTitle.length) {
                    document.querySelector(".title__letter").textContent += charArrTitle[currentIndexTitle];
                    let i = document.createElement("i");
                    i.className = "fa-solid fa-heart"
                    document.querySelector(".title__letter").appendChild(i)
                    currentIndexTitle++;
                }
                else {
                    clearInterval(intervalTitle)
                }
            }, 100)
        }, 2000)
        setTimeout(function () {
            document.querySelector("#heart__letter").classList.add("animationOp");
            document.querySelector(".love__img").classList.add("animationOp");
            document.querySelector("#mewmew").classList.add("animationOp");
        }, 2800)
        setTimeout(function () {
            document.querySelectorAll(".heart").forEach((item) => {
                item.classList.add("animation")
            })
        }, 3500)
        setTimeout(function () {
            intervalContent = setInterval(function () {
                if (currentIndexLetter < charArrDateLetter.length) {
                    text__letter.textContent += charArrDateLetter[currentIndexLetter];
                    currentIndexLetter++;
                }
                else {
                    clearInterval(intervalContent)
                }
            }, 50)
        }, 6000)
    })
    $(".close").on("click", function () {
        clearInterval(intervalContent)
        document.querySelector(".title__letter").textContent = "";
        text__letter.textContent = "";
        currentIndexLetter = 0
        currentIndexTitle = 0
        document.querySelector("#heart__letter").classList.remove("animationOp");
        document.querySelector(".love__img").classList.remove("animationOp");
        document.querySelector("#mewmew").classList.remove("animationOp");
        document.querySelectorAll(".heart").forEach((item) => {
            item.classList.remove("animation")
        })
        $(".box__letter").slideUp();
        $(".letter__border").slideUp();
    })



    let mailBox = document.querySelector('.mail')
    let boxmail = document.querySelector('.boxMail')
    var close = document.querySelector('.fa-xmark')
    mailBox.onclick = function () {
        mailBox.classList.toggle('active')
        boxmail.classList.add('active')
        requestAnimationFrame(computePagination)
    }

    close.addEventListener('click', function () {
        boxmail.classList.remove('active')
        goToPage(0)
    })

    // Tap-to-open on touch devices (the card flip is otherwise hover-only)

    boxMailContainer.addEventListener('click', function (e) {

    /* ============================================================
       Birthday letter pagination
       The message is measured against the real content area of the
       right-hand card so it can never overflow or get cut off -
       it is split into as many pages as actually fit, regardless
       of screen size or font rendering.
       ============================================================ */
    const birthdayMessageRaw = `
**Happy Birthday എന്റെ Sothumanii.. ❤️😘**

8 വർഷം… 🥹❤️
ഇത്രയും കാലം എന്നെ സഹിച്ചും, എന്നോട് വഴക്കിട്ടും, എന്നെ തിരിച്ച് സ്നേഹിച്ചും ഇപ്പോഴും എന്റെ കൂടെ നിൽക്കുന്ന നിനക്ക് ആദ്യം തന്നെ ഒരു വലിയ **Award** തരേണ്ടതാണ്. 😂🏆

നമ്മൾ ഒരുപാട് വഴക്കിട്ടു, ഒരുപാട് ചിരിച്ചു, ഒരുപാട് കരഞ്ഞു… പലപ്പോഴും പരസ്പരം മനസ്സിലാക്കാതെ പോയി. പക്ഷേ എന്തൊക്കെ സംഭവിച്ചാലും, അവസാനം നമ്മൾ വീണ്ടും **“നമ്മൾ”** ആയി തന്നെ നിന്നു. ❤️

8 വർഷം കഴിഞ്ഞിട്ടും നിന്നെ കാണുമ്പോൾ ഇപ്പോഴും ആ പഴയൊരു സന്തോഷം തന്നെയാണ്. 🥹
നീ എന്റെ girlfriend മാത്രമല്ല… എന്റെ best friend, എന്റെ favourite person, പിന്നെ എന്റെ **lifelong headache** കൂടിയാണ്. 😂❤️

ജീവിതത്തിൽ ഇനി എന്തൊക്കെ വന്നാലും, അതെല്ലാം നിന്റെ കൂടെ നേരിടാനാണ് എനിക്ക് ആഗ്രഹം.

**8 വർഷം കഴിഞ്ഞു… ഇനി ബാക്കി ജീവിതം മുഴുവൻ നിന്റെ കൂടെ ആയിരിക്കട്ടെ. ❤️**

Happy Birthday എന്റെ പെണ്ണേ… 🎂❤️
**I love you more than you know. 🥹😘**

ഒന്ന് ഓർത്തോ…
**8 വർഷം എന്നെ സഹിച്ചതുകൊണ്ട് ഇനി escape ഒന്നുമില്ല. 😂❤️**
`;

    function getParagraphs(raw) {
        return raw.trim().split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    }

    // Splits a paragraph into safe HTML tokens - **bold** phrases stay
    // atomic so a <strong> tag can never be split across two pages.
    function tokenizeParagraph(paragraph) {
        const tokens = []
        paragraph.split(/(\*\*[^*]+\*\*)/g).forEach(part => {
            if (!part) return
            if (part.startsWith('**') && part.endsWith('**')) {
                tokens.push(`<strong>${part.slice(2, -2)}</strong>`)
            } else {
                part.split('\n').forEach((line, i, arr) => {
                    line.split(/\s+/).filter(Boolean).forEach(word => tokens.push(word))
                    if (i < arr.length - 1) tokens.push('<br>')
                })
            }
        })
        return tokens
    }

    // Reusable pagination: fills pages by actually rendering content into
    // measureEl and checking its real height against maxHeight, moving
    // whatever doesn't fit onto the next page. Never relies on a fixed
    // character/word count, so it adapts to any font size or screen width.
    function paginateContent(paragraphs, measureEl, maxHeight) {
        const pages = []
        let currentParas = []

        const renderPage = paras => paras.map(html => `<p>${html}</p>`).join('')
        const fits = html => {
            measureEl.innerHTML = html
            return measureEl.scrollHeight <= maxHeight + 1
        }

        paragraphs.forEach(paragraph => {
            const tokens = tokenizeParagraph(paragraph)
            const fullHTML = tokens.join(' ')

            if (fits(renderPage([...currentParas, fullHTML]))) {
                currentParas.push(fullHTML)
                return
            }

            if (currentParas.length) {
                pages.push(renderPage(currentParas))
                currentParas = []
            }

            if (fits(renderPage([fullHTML]))) {
                currentParas = [fullHTML]
                return
            }

            // Even a single paragraph doesn't fit alone - break it up by
            // token so nothing is ever cut off or hidden.
            let chunk = []
            tokens.forEach(tok => {
                const testHTML = [...chunk, tok].join(' ')
                if (fits(renderPage([testHTML]))) {
                    chunk.push(tok)
                } else {
                    if (chunk.length) pages.push(renderPage([chunk.join(' ')]))
                    chunk = [tok]
                }
            })
            if (chunk.length) currentParas = [chunk.join(' ')]
        })

        if (currentParas.length) pages.push(renderPage(currentParas))
        return pages.length ? pages : ['']
    }

    const pageTextEl = document.getElementById('pageText')
    const pageTextMeasureEl = document.getElementById('pageTextMeasure')
    const pageIndicatorEl = document.getElementById('pageIndicator')
    const prevPageBtn = document.getElementById('prevPageBtn')
    const nextPageBtn = document.getElementById('nextPageBtn')
    const surpriseBtn = document.getElementById('surpriseBtn')

    let bookPages = []
    let currentPageIndex = 0

    function computePagination() {
        const maxHeight = pageTextEl.clientHeight
        if (!maxHeight) return
        const paragraphs = getParagraphs(birthdayMessageRaw)
        bookPages = paginateContent(paragraphs, pageTextMeasureEl, maxHeight)
        goToPage(Math.min(currentPageIndex, bookPages.length - 1))
    }

    function renderPage(direction) {
        if (!bookPages.length) return
        pageTextEl.innerHTML = bookPages[currentPageIndex]
        pageTextEl.classList.remove('page-anim-next', 'page-anim-prev')
        if (direction) {
            void pageTextEl.offsetWidth
            pageTextEl.classList.add(direction === 'next' ? 'page-anim-next' : 'page-anim-prev')
        }

        const isFirst = currentPageIndex === 0
        const isLast = currentPageIndex === bookPages.length - 1

        prevPageBtn.hidden = isFirst
        nextPageBtn.hidden = isLast
        surpriseBtn.classList.toggle('show', isLast)

        pageIndicatorEl.textContent = `${currentPageIndex + 1} / ${bookPages.length}`
    }

    function goToPage(index, direction) {
        if (!bookPages.length) return
        currentPageIndex = Math.max(0, Math.min(index, bookPages.length - 1))
        renderPage(direction)
    }

    function goToNextPage() {
        if (currentPageIndex < bookPages.length - 1) goToPage(currentPageIndex + 1, 'next')
    }

    function goToPreviousPage() {
        if (currentPageIndex > 0) goToPage(currentPageIndex - 1, 'prev')
    }

    prevPageBtn.addEventListener('click', goToPreviousPage)
    nextPageBtn.addEventListener('click', goToNextPage)

    function debounce(fn, wait) {
        let t
        return (...args) => {
            clearTimeout(t)
            t = setTimeout(() => fn(...args), wait)
        }
    }

    window.addEventListener('load', computePagination)
    window.addEventListener('resize', debounce(() => {
        if (boxmail.classList.contains('active')) computePagination()
    }, 200))

    /* ============================================================
       Surprise popup
       ============================================================ */
    const surpriseOverlay = document.getElementById('surpriseOverlay')
    const surpriseModal = document.getElementById('surpriseModal')
    const surpriseCloseBtn = document.getElementById('surpriseClose')

    function handleSurpriseKeydown(e) {
        if (e.key === 'Escape') closeSurprise()
    }

    function openSurprise() {
        surpriseOverlay.classList.add('active')
        surpriseOverlay.setAttribute('aria-hidden', 'false')
        document.body.style.overflow = 'hidden'
        surpriseModal.focus()
        document.addEventListener('keydown', handleSurpriseKeydown)
    }

    function closeSurprise() {
        surpriseOverlay.classList.remove('active')
        surpriseOverlay.setAttribute('aria-hidden', 'true')
        document.body.style.overflow = ''
        document.removeEventListener('keydown', handleSurpriseKeydown)
        surpriseBtn.focus()
    }

    surpriseBtn.addEventListener('click', openSurprise)
    surpriseCloseBtn.addEventListener('click', closeSurprise)
    surpriseOverlay.addEventListener('click', function (e) {
        if (e.target === surpriseOverlay) closeSurprise()
    })
</script>
